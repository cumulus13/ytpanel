x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://ytpanel:${POSTGRES_PASSWORD}@db:5432/ytpanel
    REDIS_URL: redis://redis:6379/0
    YTP_DOWNLOAD_ROOT: /data/downloads
  volumes:
    - downloads:/data/downloads
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_started}
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ytpanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ytpanel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ytpanel"], interval: 5s, retries: 10}
    restart: unless-stopped
  redis:
    image: redis:7
    restart: unless-stopped
  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && python manage.py bootstrap && python manage.py collectstatic --noinput && gunicorn ytpanel.wsgi -b 0.0.0.0:8000 --workers 3"
    ports: ["8000:8000"]
  worker-downloads:   # runs the yt-dlp subprocesses; concurrency must be >= "max simultaneous downloads"
    <<: *app
    command: celery -A ytpanel worker -Q downloads -n dl@%h -c ${YTP_WORKER_CONCURRENCY:-8} -l INFO
  worker-ctl:         # scheduler tick / reaper / auto-purge
    <<: *app
    command: celery -A ytpanel worker -Q celery -n ctl@%h -c 2 -l INFO
  beat:
    <<: *app
    command: celery -A ytpanel beat -l INFO

volumes:
  pgdata:
  downloads:
