{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}ytpanel{% endblock %}</title>
  <script>try{var t=localStorage.getItem("ytp-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="{% static 'core/app.css' %}">
</head>
<body>
<header class="top">
  <a class="brand" href="{% url 'dashboard' %}">yt<span>panel</span></a>
  <nav>
    {% if user.is_authenticated %}
      <span class="muted">{{ user.username }}</span>
      {% if user.is_staff %}<a href="{% url 'settings' %}">Settings</a>{% endif %}
      <button type="button" id="theme" class="ghost" title="Toggle dark mode">&#9680;</button>
      <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="ghost">Logout</button></form>
    {% else %}
      <button type="button" id="theme" class="ghost" title="Toggle dark mode">&#9680;</button>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<script src="{% static 'core/theme.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
